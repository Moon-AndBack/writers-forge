name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint / Typecheck / Format / Commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # commitlint 需要 base/head 两个提交都存在，浅克隆下 base.sha 可能缺失。
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # package.json 未声明 engines，这里显式指定 LTS 版本。
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # 仅做静态检查，不需要 Electron 二进制，跳过下载以缩短耗时。
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: |
          npx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
